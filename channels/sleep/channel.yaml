slug: "sleep"
name: "Quiet Hours"          # working name; check YouTube handle and trademark availability before committing
status: planning
niche: sleep
sub_niche: "accurate, calm narrated history for adults who want to fall asleep, plus ambient and story series"   # validate against live search results
audience: "adults 25-55 who play long audio-led video with the screen dim or off"
language: en
format:
  type: long_form
  target_length_min: 90     # first 10 videos: test 60 / 90 / 120; imitators often run 2-3+ hours
  cadence_per_week: 2
series:
  - id: quiet-history
    role: core              # launch first, proven demand
    description: "Narrated calm history, one distinct topic per video, sources listed"
  - id: still-weather
    role: probe             # add after 8 core videos; needs recorded or licensed audio with provenance
    description: "Single-location rain, wind, and water recordings, 3+ hours"
  - id: gentle-stories
    role: probe             # add after 8 core videos
    description: "Original calm fiction with no plot tension"
voice:
  provider: ""              # paid plan with commercial rights, or a hired human narrator
  plan: ""
  voice_id: ""
  clearly_synthetic: false  # assume convincingly human => disclose
  pronunciation_lexicon: "assets/lexicon.txt"
music:
  source: "generated-bed"   # rain/wind bed generated by tools/make_bed.py (our own output); no third-party music
  license_ref: "own work, generated with ffmpeg"
monetization:
  ypp_status: not_started
  affiliate: []             # candidates: sleep products, white noise, apps; verify programs and disclosure rules
  sponsors: []
accounts:
  google_account_note: "dedicated Google account + brand channel; 2-Step Verification on"
  api_audited: false
kpis:
  target_avg_view_duration_pct: 35   # placeholder; set from first 10 videos
  target_ctr_pct: 4                  # placeholder
